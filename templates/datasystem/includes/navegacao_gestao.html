{% load static %}
<aside class="sidebar" id="retorna-sidebar" aria-label="Navegação principal">
  <a class="sidebar-brand" href="{% url 'empresas:area' %}" aria-label="Retorna — Lojas">
    <img class="retorna-brand-full" src="{% static 'retorna/brand/retorna-logo-dark.svg' %}" alt="Retorna" width="152">
    <img class="retorna-brand-compact" src="{% static 'retorna/brand/retorna-icon.svg' %}" alt="" width="32" height="32">
  </a>
  <div class="retorna-company"><div class="retorna-company-label">Empresa ativa</div><div class="retorna-company-name" title="{{ gestao.empresa }}">{{ gestao.empresa }}</div></div>
  <nav class="sidebar-nav" aria-label="Navegação de Gestão">
    <div class="nav-group" data-sidebar-section>
      <button class="nav-section-toggle" type="button" aria-expanded="true" aria-controls="sidebar-group-gestao" data-sidebar-section-toggle><span>Gestão</span><span class="nav-section-chevron" aria-hidden="true">›</span></button>
      <div class="nav-group-items" id="sidebar-group-gestao">
      {% for item in gestao.navegacao %}
        <a class="nav-link{% if item.ativo %} active{% endif %}" href="{{ item.url }}" aria-label="{{ item.nome }}" data-rail-label="{{ item.nome }}"{% if item.ativo %} aria-current="page"{% endif %}>
          <svg class="retorna-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          {% if item.chave == 'lojas' %}<path d="M3 10l2-6h14l2 6M4 10v10h16V10M9 20v-7h6v7M3 10h18"/>
          {% elif item.chave == 'membros' %}<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2"/><path d="M3 21v-2a6 6 0 0112 0v2M16 15a5 5 0 015 5"/>
          {% elif item.chave == 'configuracao' %}<path d="M4 6h16M4 12h16M4 18h16M8 3v6M16 9v6M10 15v6"/>
          {% elif item.chave == 'niveis' %}<path d="M4 20h16M5 20v-5h4v5M10 20V10h4v10M15 20V4h4v16"/>
          {% elif item.chave == 'campanhas' %}<path d="M4 10v5h5l10 5V5L9 10H4M8 15l2 6M19 10h3"/>
          {% else %}<path d="M8 3v5M16 3v5M6 8h12v4a6 6 0 01-12 0V8M12 18v4"/>{% endif %}
          </svg><span class="nav-text">{{ item.nome }}</span>
        </a>
      {% endfor %}
      </div>
    </div>
  </nav>
</aside>
