<dialog class="retorna-appearance" data-appearance-panel aria-labelledby="appearance-title">
<h2 id="appearance-title">Aparência e acessibilidade</h2>
<fieldset><legend>Tema</legend>
<label><input type="radio" name="theme" value="system"> Automático</label>
<label><input type="radio" name="theme" value="light"> Claro</label>
<label><input type="radio" name="theme" value="dark"> Escuro</label>
</fieldset>
<fieldset><legend>Tamanho do texto</legend>
<label><input type="radio" name="fontScale" value="100"> Padrão — 100%</label>
<label><input type="radio" name="fontScale" value="110"> Grande — 110%</label>
<label><input type="radio" name="fontScale" value="120"> Maior — 120%</label>
</fieldset>
<fieldset><legend>Formulários</legend>
<label><input type="radio" name="formMode" value="steps"> Em etapas</label>
<label><input type="radio" name="formMode" value="all"> Exibir tudo</label>
</fieldset>
<p class="helptext">O modo dos formulários será usado ao abrir o próximo formulário.</p>
<p data-appearance-status role="status" aria-live="polite"></p>
<div class="form-actions"><button type="button" class="button button--secondary" data-appearance-reset>Restaurar padrão</button><button type="button" class="button" data-appearance-close>Fechar</button></div>
</dialog>
